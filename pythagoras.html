<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kalkulator Pythagoras — Jonatan Haloho</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;500;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="./dist/output.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📐</text></svg>" />
  <meta name="description" content="Kalkulator sisi miring segitiga siku-siku (Teorema Pythagoras) — proyek JavaScript oleh Jonatan Haloho." />
</head>
<body class="font-body text-ink bg-cream min-h-screen flex flex-col">

  <header class="border-b border-line">
    <nav class="max-w-content mx-auto px-6 md:px-10 h-20 flex items-center justify-between">
      <a href="./index.html" class="font-display font-bold text-xl">Jonatan Haloho.</a>
      <a href="./index.html#projects" class="rounded-full border border-ink px-5 py-2.5 text-sm font-semibold hover:border-accent hover:text-accent transition-colors">
        ← Kembali ke Proyek
      </a>
    </nav>
  </header>

  <main class="flex-1 max-w-content w-full mx-auto px-6 md:px-10 py-16 md:py-24">
    <div class="max-w-xl mx-auto">
      <p class="font-mono text-xs text-accent mb-3">02 / JavaScript</p>
      <h1 class="font-display font-bold text-3xl md:text-4xl mb-3">Kalkulator Sisi Miring</h1>
      <p class="text-muted mb-10 leading-relaxed">
        Menghitung panjang sisi miring (hipotenusa) segitiga siku-siku dari dua sisi siku-sikunya
        (alas dan tinggi), menggunakan Teorema Pythagoras: <span class="font-mono">c = √(a² + b²)</span>
      </p>

      <div class="border border-line rounded-3xl bg-paper p-6 md:p-10">
        <div class="grid sm:grid-cols-2 gap-5 mb-6">
          <div>
            <label for="sideA" class="block text-sm font-semibold mb-1.5">Sisi A (alas / sisi datar)</label>
            <input
              id="sideA"
              type="number"
              inputmode="decimal"
              min="0"
              step="any"
              placeholder="3"
              class="w-full border border-line rounded-lg px-4 py-2.5 bg-cream focus:outline-none focus:ring-2 focus:ring-accent"
            />
          </div>
          <div>
            <label for="sideB" class="block text-sm font-semibold mb-1.5">Sisi B (tinggi / sisi tegak)</label>
            <input
              id="sideB"
              type="number"
              inputmode="decimal"
              min="0"
              step="any"
              placeholder="4"
              class="w-full border border-line rounded-lg px-4 py-2.5 bg-cream focus:outline-none focus:ring-2 focus:ring-accent"
            />
          </div>
        </div>

        <button
          id="calcBtn"
          type="button"
          class="w-full sm:w-auto rounded-full bg-ink text-cream px-8 py-3 font-semibold hover:bg-accent transition-colors"
        >
          Hitung
        </button>

        <p id="errorMsg" class="text-accent text-sm mt-4 hidden"></p>

        <div id="resultBox" class="mt-8 pt-6 border-t border-line hidden">
          <p class="text-sm text-muted mb-1">Panjang sisi miring (c)</p>
          <p id="resultValue" class="font-display font-bold text-4xl md:text-5xl"></p>
        </div>
      </div>
    </div>
  </main>

  <footer class="py-6 text-center text-xs text-muted">
    © 2026 Jonatan Haloho
  </footer>

  <script src="./src/js/pythagoras.js"></script>
</body>
</html>
